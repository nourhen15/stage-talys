groups:
  - name: fraud_api_alerts
    rules:

      - alert: FraudAPIUnavailable
        expr: up{job="fraud-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Fraud Detection API indisponible"
          description: "L'API de détection de fraude ne répond plus depuis plus d'une minute."

      - alert: FraudAPILatencyHigh
        expr: histogram_quantile(0.95, rate(fraud_prediction_latency_seconds_bucket[5m])) > 0.2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Latence élevée de l'API"
          description: "La latence P95 des prédictions dépasse 200 ms depuis plus de 2 minutes."