global:
  scrape_interval: 15s  # Prometheus interroge les cibles toutes les 15 secondes

scrape_configs:
  - job_name: 'fraud-api'
    static_configs:
      # "fraud-api" correspond au nom du service dans docker-compose.yaml -
      # Docker gère automatiquement la résolution de ce nom vers la bonne adresse IP
      - targets: ['fraud-api:8000']

  - job_name: 'cadvisor'
    static_configs:
      # cAdvisor expose les métriques de tous les conteneurs Docker (CPU, mémoire...)
      - targets: ['cadvisor:8080']