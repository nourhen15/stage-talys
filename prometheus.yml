global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: 'fraud-api'
    static_configs:
      - targets: ['fraud-api:8000']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']